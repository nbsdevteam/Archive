<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
  <meta name="description" content="Smarthr - Bootstrap Admin Template">
	<meta name="keywords" content="admin, estimates, bootstrap, business, corporate, creative, management, minimal, modern, html5, responsive">
	<meta name="author" content="Dreamstechnologies - Bootstrap Admin Template">
	<meta name="robots" content="noindex, nofollow">
  <!-- Favicon -->
	<!-- <link rel="shortcut icon" type="image/x-icon" href="/favicon.png"> -->
	<!-- Apple Touch Icon -->
	<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
  <!-- Pre-paint: set dir/lang and Bootstrap LTR/RTL from saved language to avoid flash -->
  <script>
    (function() {
      var lng = (typeof localStorage !== 'undefined' && localStorage.getItem('i18nextLng')) || '';
      var isAr = lng.indexOf('ar') === 0;
      var doc = document.documentElement;
      doc.lang = isAr ? 'ar' : 'en';
      doc.dir = isAr ? 'rtl' : 'ltr';
      var link = document.getElementById('bootstrap-direction-css');
      if (!link) {
        link = document.createElement('link');
        link.id = 'bootstrap-direction-css';
        link.rel = 'stylesheet';
        link.type = 'text/css';
        document.head.appendChild(link);
      }
      link.href = isAr ? '/assets/css/bootstrap.rtl.min.css' : '/assets/css/bootstrap.min.css';
    })();
  </script>
  <title>NBS Archive System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
